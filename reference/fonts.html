<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bo7 · Font pairings</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&family=Source+Sans+3:wght@400;600&family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=Instrument+Serif&family=Instrument+Sans:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Space+Grotesk:wght@700&family=Work+Sans:wght@400;500;600&family=Barlow+Condensed:wght@700&family=Barlow:wght@400;500;600&family=Oswald:wght@600&family=Open+Sans:wght@400;600&family=Lora:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: oklch(17% 0.012 80); --ink-2: oklch(26% 0.014 80);
    --paper: oklch(97.5% 0.009 85); --stone: oklch(84% 0.012 85); --muted: oklch(46% 0.018 80);
    --gold: oklch(70% 0.15 88); --gold-ink: oklch(24% 0.05 86);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Archivo, sans-serif; }
  .top { padding: 2rem clamp(1rem, 4vw, 3rem) 1rem; max-width: 1320px; margin: 0 auto; }
  .top h1 { font: 700 1.5rem/1.2 Archivo, sans-serif; margin: 0 0 .5rem; }
  .top p { margin: 0; color: var(--muted); max-width: 46rem; }
  .grid { display: grid; gap: 1.5rem; padding: 1rem clamp(1rem, 4vw, 3rem) 4rem; max-width: 1320px; margin: 0 auto; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }

  .card { background: var(--ink); color: var(--paper); border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; }
  .card__label {
    display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    padding: .75rem 1.5rem; background: var(--ink-2); font: 600 .8rem/1.3 Archivo, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: oklch(72% 0.012 85);
  }
  .card__label b { color: var(--paper); }
  .card__label i { font-style: normal; color: var(--gold); }
  .hero { padding: 2.25rem 1.75rem 2rem; font-family: var(--body); }
  .eyebrow { font-size: .78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin: 0 0 1rem; }
  h2 { font-family: var(--display); font-weight: var(--display-weight, 700); font-size: clamp(2.4rem, 1.6rem + 2.4vw, 3.6rem); line-height: 1; letter-spacing: var(--display-track, -0.01em); margin: 0; text-wrap: balance; }
  h2::after { content: ""; display: block; width: 4rem; height: 5px; background: var(--gold); margin-top: 1.2rem; }
  .lede { margin: 1.4rem 0 0; max-width: 32rem; font-size: 1.1rem; line-height: 1.55; color: oklch(82% 0.012 85); }
  .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.75rem; }
  .btn { display: inline-flex; align-items: center; min-height: 3rem; padding: 0 1.3rem; font-weight: 600; font-size: .95rem; border-radius: 2px; border: 2px solid transparent; text-decoration: none; }
  .btn--gold { background: var(--gold); color: var(--gold-ink); }
  .btn--ghost { color: var(--paper); border-color: oklch(60% 0.02 85); }
  .facts { list-style: none; padding: 1.2rem 0 0; margin: 2rem 0 0; display: flex; gap: 2.25rem; border-top: 1px solid oklch(32% 0.014 80); color: oklch(70% 0.012 85); font-size: .85rem; }
  .facts strong { display: block; font-family: var(--display); font-weight: var(--display-weight, 700); font-size: 1.5rem; color: var(--gold); line-height: 1.1; }
  .sub { padding: 1rem 1.75rem 1.5rem; background: var(--paper); color: var(--ink); font-family: var(--body); border-top: 4px solid var(--gold); }
  .sub h3 { font-family: var(--display); font-weight: var(--display-weight, 700); font-size: 1.5rem; margin: 0 0 .4rem; letter-spacing: var(--display-track, -0.01em); }
  .sub p { margin: 0; color: var(--muted); font-size: 1rem; line-height: 1.55; max-width: 34rem; }
</style>
</head>
<body>
<div class="top">
  <h1>Bo7 font pairings</h1>
  <p>Same hero copy in each pairing, plus a light section sample underneath. Card 01 is what the site uses now. All fonts are free on Google Fonts, so any choice is a one-line swap.</p>
</div>

<div class="grid" id="grid"></div>

<template id="card">
  <article class="card">
    <div class="card__label"><span><b class="n"></b> <span class="names"></span></span><i class="kind"></i></div>
    <div class="hero">
      <p class="eyebrow">Semi-private personal training · Blackrock & Killiney</p>
      <h2>Future proof<br>your body.</h2>
      <p class="lede">The attention of a personal trainer. The energy of a small group. A coach on the floor at every session, and a programme written for you, not for the room.</p>
      <div class="actions"><a class="btn btn--gold" href="#">Book a free consultation</a><a class="btn btn--ghost" href="#">WhatsApp 085 241 3999</a></div>
      <ul class="facts"><li><strong>2</strong> gyms, south Dublin</li><li><strong>Every</strong> session coached</li><li><strong>All</strong> levels, beginners welcome</li></ul>
    </div>
    <div class="sub">
      <h3>A coach on the floor</h3>
      <p>Every session is led by a coach who corrects your technique, adjusts the load and knows your name. Not a video on a screen.</p>
    </div>
  </article>
</template>

<script>
  const pairs = [
    { d: '"Archivo Black"', b: 'Archivo', w: 400, kind: 'current · sans / sans' },
    { d: 'Fraunces', b: 'Inter', w: 700, kind: 'serif / sans', track: '-0.02em' },
    { d: '"Playfair Display"', b: '"Source Sans 3"', w: 700, kind: 'serif / sans' },
    { d: '"DM Serif Display"', b: '"DM Sans"', w: 400, kind: 'serif / sans' },
    { d: '"Instrument Serif"', b: '"Instrument Sans"', w: 400, kind: 'serif / sans', track: '0' },
    { d: '"Bricolage Grotesque"', b: 'Inter', w: 700, kind: 'sans / sans', track: '-0.02em' },
    { d: '"Space Grotesk"', b: '"Work Sans"', w: 700, kind: 'sans / sans' },
    { d: '"Barlow Condensed"', b: 'Barlow', w: 700, kind: 'sans / sans', track: '0' },
    { d: 'Oswald', b: '"Open Sans"', w: 600, kind: 'sans / sans', track: '0' },
    { d: '"Archivo Black"', b: 'Lora', w: 400, kind: 'sans / serif' },
    { d: 'Inter', b: '"Source Serif 4"', w: 600, kind: 'sans / serif', track: '-0.03em' },
  ];
  const grid = document.getElementById('grid'), tpl = document.getElementById('card');
  pairs.forEach((p, i) => {
    const el = tpl.content.cloneNode(true);
    const card = el.querySelector('.card');
    card.style.setProperty('--display', p.d);
    card.style.setProperty('--body', p.b);
    card.style.setProperty('--display-weight', p.w);
    if (p.track) card.style.setProperty('--display-track', p.track);
    el.querySelector('.n').textContent = String(i + 1).padStart(2, '0');
    el.querySelector('.names').textContent = `${p.d.replace(/"/g, '')} + ${p.b.replace(/"/g, '')}`;
    el.querySelector('.kind').textContent = p.kind;
    grid.appendChild(el);
  });
</script>
</body>
</html>
